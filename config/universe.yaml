# Universo cubierto: 20 acciones del panel líder y 20 CEDEARs (spec 4.1, tarea T2.1).
#
# Se carga en la base con `python -m brujula.cli sincronizar-universo` (ver docs/adr/010).
# Cambiar el universo es editar este archivo y volver a sincronizar: lo que sale del archivo
# queda inactivo en la base (no se borra, porque puede haber posiciones que lo usan).

version: 1

seleccion:
  fecha_de_corte: 2026-10-07
  ventana:
    desde: 2026-07-01
    hasta: 2026-09-30
    descripcion: Tercer trimestre de 2026, el último trimestre cerrado a la fecha de corte.
  fuente: >-
    BYMA Open Data (fuente oficial del mercado), serie histórica diaria de cada especie en plazo
    24 hs (endpoint chart/historical-series/history). Composición del panel líder: endpoint
    leading-equity. Lista de CEDEARs: endpoint cedears, solo especies en pesos.
  metrica: >-
    Monto operado aproximado en pesos: suma diaria de cierre × volumen nominal. Todas las especies
    elegidas tienen las 64 ruedas de la ventana.
  criterio_acciones: >-
    El panel líder tiene 20 especies a la fecha de corte; entran todas, ordenadas por monto.
  criterio_cedears: >-
    Los 20 CEDEARs de empresas con mayor monto. Se excluyen ETF y fondos porque no publican estados
    contables que se puedan informar (spec 4.2). El primer CEDEAR de empresa que quedó afuera es HUT
    (136.030 millones).
  excluidos:
    SPY: ETF (482.112 millones)
    IBIT: ETF de bitcoin (254.319 millones)
    GLD: ETF de oro (209.122 millones)
    QQQ: ETF (206.073 millones)
  fuentes_de_datos:
    ratio_cedear: >-
      Listas de los emisores: Banco Comafi (comafi.com.ar/custodiaglobal, Programas CEDEARs) y Caja
      de Valores (cajadevalores.com.ar, CEDEARS.xlsx) para MU y MSTR; lista "CEDEARs negociables
      en BYMA" del 12/06/2026 para SNDK, SPCX y NBIS. Todos verificados el 2026-10-07 contra el
      ratio implícito (precio en EE. UU. × CCL / precio del CEDEAR en pesos), con diferencias
      menores al 1 %.
    cik_sec: SEC, company_tickers.json; país y sector desde data.sec.gov/submissions.
    pais: País de la sede según la SEC (las acciones del panel líder, Argentina).
    sector: >-
      Agrupación propia en castellano: para los CEDEARs sigue el código SIC de la SEC; para las
      acciones argentinas, la actividad principal de la empresa.
  ranking_millones_ars:
    acciones:
      GGAL: 989240
