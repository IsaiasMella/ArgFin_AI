# Métricas obligatorias por sector (T3.4, plan 7.2.4). Un estado contable al que le falte
# alguna no se valida: queda en revisión manual (T3.5). Los sectores son los de
# universe.yaml; `comunes` se exige a todos.
#
# Solo se exigen cifras que todos los estados imprimen. Subtotales como el resultado bruto o
# el operativo no siempre figuran en los estados firmados (cada empresa arma su estado de
# resultados): si no se pueden verificar, no se publican, pero no bloquean el documento.
#
# Bancos y no bancos comparten el sector "Financiero" (BYMA y Banco de Valores no son
# bancos comerciales): se exige solo lo que tienen todos.

version: 1

comunes:
  - activo_total
  - pasivo_total
  - patrimonio_neto
  - resultado_neto

sectores:
  Financiero: []
  Petróleo y gas: [ingresos]
  Energía eléctrica: [ingresos]
  Gas natural: [ingresos]
  Materiales: [ingresos]
  Telecomunicaciones: [ingresos]
  Conglomerado: [ingresos]
  Tecnología: [ingresos]
  Consumo: [ingresos]
  Salud: [ingresos]
  Automotriz: [ingresos]
