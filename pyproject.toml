[project]
name = "brujula"
version = "0.1.0"
description = "Seguimiento informativo de portafolios de acciones argentinas y CEDEARs (API y worker)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.142.2",
    "procrastinate>=3.10.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.3",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.16.10",
    "testcontainers>=4.15.0",
    "types-pyyaml>=6.0.12.20260906",
]

# --- Ruff -------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "migrations"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "S",        # bandit (seguridad)
    "SIM",      # simplificaciones
    "PTH",      # pathlib en lugar de os.path
    "DTZ",      # datetimes sin zona horaria
    "ASYNC",    # errores comunes en código async
    "PT",       # estilo pytest
    "RUF",
]

[tool.ruff.lint.isort]
known-first-party = ["brujula", "tests"]

[tool.ruff.lint.per-file-ignores]
# En tests se permiten assert y subprocess con ejecutables del PATH.
"tests/**" = ["S101", "S603", "S607"]

# --- mypy -------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "migrations"]
mypy_path = "src"
# Resuelve `tests.support` como paquete desde la raíz.
explicit_package_bases = true
plugins = ["pydantic.mypy"]

# --- pytest -----------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# Raíz en sys.path para importar `tests.support` (modo importlib no la agrega).
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
