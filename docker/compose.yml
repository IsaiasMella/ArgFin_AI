# Uso (desde la raíz del repositorio):
#   docker compose -f docker/compose.yml --env-file .env up -d --build
# Solo Caddy publica puertos; API, worker y PostgreSQL quedan en la red interna.

name: brujula

x-image: &image
  build:
    context: ..
    dockerfile: docker/Dockerfile
  image: brujula-api:local
  env_file: ../.env

x-app: &app
  <<: *image
  restart: unless-stopped
  # Documentos descargados (DOCUMENT_STORAGE_DIR=/app/data/documents). Va en los backups (T8.2).
  volumes:
    - documents:/app/data/documents
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  # Aplica las migraciones con el rol de migraciones y termina.
  migrate:
    <<: *image
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    <<: *app
    command: ["python", "-m", "brujula.worker"]

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    # Solo las variables que necesita: no recibe los secretos de la app.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?definí POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definí POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?definí POSTGRES_DB en .env}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:?definí POSTGRES_APP_USER en .env}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?definí POSTGRES_APP_PASSWORD en .env}
      POSTGRES_MIGRATOR_USER: ${POSTGRES_MIGRATOR_USER:?definí POSTGRES_MIGRATOR_USER en .env}
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?definí POSTGRES_MIGRATOR_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Crea roles y extensiones solo al inicializar un volumen vacío.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:?definí CADDY_SITE_ADDRESS en .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  documents:
  caddy_data:
  caddy_config:
